<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LifeCalc — Understand Your Money. Plan Your Future.</title>
    <meta name="description" content="LifeCalc helps you explore financial goals, investments, retirement planning, and future projections through simple financial calculators." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LifeCalc — Understand Your Money. Plan Your Future." />
    <meta property="og:description" content="LifeCalc helps you explore financial goals, investments, retirement planning, and future projections through simple financial calculators." />
    <meta property="og:site_name" content="LifeCalc" />

    <!-- Canonical & URL -->
    <link rel="canonical" href="https://lifecalc.app/" />
    <meta property="og:url" content="https://lifecalc.app/" />

    <!-- Robots -->
    <meta name="robots" content="index,follow" />

    <!-- Theme color -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LifeCalc — Understand Your Money. Plan Your Future." />
    <meta name="twitter:description" content="LifeCalc helps you explore financial goals, investments, retirement planning, and future projections through simple financial calculators." />

    <!-- JSON-LD (Organization / WebSite) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "LifeCalc",
        "url": "https://lifecalc.app/",
        "description": "LifeCalc helps you explore financial goals, investments, retirement planning, and future projections through simple financial calculators.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://lifecalc.app/?s={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
